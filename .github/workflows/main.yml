name: AgentMailor Freelance Web & AI Outreach

on:
  schedule:
    # Daily at 6:00 AM IST (00:30 UTC)
    - cron: "30 0 * * *"
    # Daily at 6:00 PM IST (12:30 UTC)
    - cron: "30 12 * * *"

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (write emails but do NOT send; recommended)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      force_resume:
        description: "Ignore the bounce-rate pause for this run"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  tests:
    name: Compile and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q mailor.py agentmailor tests
      - name: Smoke-test import and SMTP safety defaults
        run: python -c "import mailor; assert mailor.DRY_RUN; assert not mailor.LIVE_OUTREACH_ENABLED; assert mailor.send_email('test@example.com', 'test', 'test') is None"
      - name: Run intelligence tests
        run: python -m unittest discover -s tests -v

  send-outreach:
    name: Outreach (non-PR events only)
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Outreach Script
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          # Scheduled runs default to dry-run. Manual runs follow the explicit input.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'true' }}
          # Live sending requires BOTH DRY_RUN=false and this explicit repository variable.
          LIVE_OUTREACH_ENABLED: ${{ vars.LIVE_OUTREACH_ENABLED || 'false' }}
          FOLLOWUP_ENABLED: ${{ vars.FOLLOWUP_ENABLED || 'false' }}
          RESEARCH_SCORE_MIN: ${{ vars.RESEARCH_SCORE_MIN || '40' }}
          BUSINESS_HOURS_ONLY: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
          FORCE_RESUME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_resume || 'false' }}
          DAILY_LIMIT: "10"
          SCORE_MIN: ${{ vars.SCORE_MIN || '6' }}
          BOUNCE_PAUSE_RATE: ${{ vars.BOUNCE_PAUSE_RATE || '0.15' }}
          BOUNCE_MIN_SAMPLE: ${{ vars.BOUNCE_MIN_SAMPLE || '30' }}
          BOUNCE_MIN_COUNT: ${{ vars.BOUNCE_MIN_COUNT || '4' }}
          COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_PHONE: ${{ vars.COMPANY_PHONE }}
          COMPANY_WEBSITE: ${{ vars.COMPANY_WEBSITE }}
          COMPANY_WHO: ${{ vars.COMPANY_WHO }}
          SERVICE_OFFERINGS: ${{ vars.SERVICE_OFFERINGS }}
          PRODUCT_FEATURES: ${{ vars.PRODUCT_FEATURES }}
          DEMO_PHONE: ${{ vars.DEMO_PHONE }}
          PROOF_LINE: ${{ vars.PROOF_LINE }}
          PRICE_LINE: ${{ vars.PRICE_LINE }}
          DELIVERY_DAYS: "5-7 working days"
        run: python mailor.py

      - name: Save Logs (prevents emailing anyone twice)
        if: always()
        run: |
          git config user.name "agentmailor-bot"
          git config user.email "agentmailor-bot@users.noreply.github.com"
          for f in sent_log.csv call_list.csv call_list_old.csv api_usage.json suppression.txt recent_emails.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || (git commit -m "chore: update logs" && git pull --rebase --autostash && git push)

      - name: Upload Log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-log
          path: |
            himalaya_outreach.log
            call_list.csv
          retention-days: 7
          if-no-files-found: ignore
