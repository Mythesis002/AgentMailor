name: Himalaya IT AI Call Agent Outreach

on:
  schedule:
    # Three runs per weekday so each region is emailed during ITS business hours (times in UTC)
    - cron: "30 4 * * 1-5"     # India / Asia-Pacific morning
    - cron: "0 9 * * 1-5"      # Europe / Middle East / Africa / India afternoon
    - cron: "30 16 * * 1-5"    # Americas morning
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (write emails but do NOT send)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      force_resume:
        description: "Ignore the bounce-rate pause for this run"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write              # needed to commit the logs back to the repo

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  send-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Outreach Script
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # Optional: a proper sending service instead of Gmail (leave unset to use Gmail)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          # Scheduled runs send for real; manual runs follow the dry_run input and ignore local business hours
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          BUSINESS_HOURS_ONLY: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
          FORCE_RESUME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_resume || 'false' }}
          DAILY_LIMIT: "10"
          # Only businesses scoring at least this on the "needs a call agent" fit score are contacted
          SCORE_MIN: ${{ vars.SCORE_MIN || '6' }}
          # Bounce guard: pauses only after >= 30 sends AND >= 4 bounces AND rate above 15%. Tune via repo Variables.
          BOUNCE_PAUSE_RATE: ${{ vars.BOUNCE_PAUSE_RATE || '0.15' }}
          BOUNCE_MIN_SAMPLE: ${{ vars.BOUNCE_MIN_SAMPLE || '30' }}
          BOUNCE_MIN_COUNT: ${{ vars.BOUNCE_MIN_COUNT || '4' }}
          # Repo Variables (Settings > Secrets and variables > Actions > Variables). All optional except COMPANY_ADDRESS for the US.
          COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_PHONE: ${{ vars.COMPANY_PHONE }}
          COMPANY_WEBSITE: ${{ vars.COMPANY_WEBSITE }}
          COMPANY_WHO: ${{ vars.COMPANY_WHO }}
          PRODUCT_FEATURES: ${{ vars.PRODUCT_FEATURES }}
          # The three biggest reply-rate boosters (write TRUE lines only):
          DEMO_PHONE: ${{ vars.DEMO_PHONE }}      # number owners can call to hear the AI receptionist
          PROOF_LINE: ${{ vars.PROOF_LINE }}      # e.g. It already answers calls for 6 clinics in Delhi.
          PRICE_LINE: ${{ vars.PRICE_LINE }}      # e.g. Plans start at Rs 2,999 a month.
          DELIVERY_DAYS: "5-7 working days"
        run: python mailor.py

      - name: Save Logs (prevents emailing anyone twice)
        if: always()
        run: |
          git config user.name "himalaya-bot"
          git config user.email "himalaya-bot@users.noreply.github.com"
          for f in sent_log.csv call_list.csv call_list_old.csv api_usage.json suppression.txt recent_emails.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || (git commit -m "chore: update logs" && git pull --rebase --autostash && git push)

      - name: Upload Log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-log
          path: |
            himalaya_outreach.log
            call_list.csv
          retention-days: 7
